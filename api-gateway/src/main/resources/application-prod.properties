spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# User Service Route
spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

# Restaurant Service Route
spring.cloud.gateway.mvc.routes[1].id=restaurant-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/restaurant-service/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=1

# Order Service Route
spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/order-service/**
spring.cloud.gateway.mvc.routes[2].filters[0]=StripPrefix=1

# Payment Service Route
spring.cloud.gateway.mvc.routes[3].id=payment-service
spring.cloud.gateway.mvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/payment-service/**
spring.cloud.gateway.mvc.routes[3].filters[0]=StripPrefix=1

# Notification Service Route
spring.cloud.gateway.mvc.routes[4].id=notification-service
spring.cloud.gateway.mvc.routes[4].uri=http://localhost:8085
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.mvc.routes[4].filters[0]=StripPrefix=1
