<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Secure Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #ff6b81;
            --bg-color: #0f1115;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --success: #2ed573;
            --error: #ff4757;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(255, 71, 87, 0.08), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(46, 213, 115, 0.08), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .checkout-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #a4b0be);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.1);
        }

        .pay-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }

        .pay-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--primary);
        }

        .pay-btn:active {
            transform: translateY(0);
        }

        .pay-btn.loading {
            color: transparent;
            pointer-events: none;
        }

        .pay-btn.loading::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-top: -10px;
            margin-left: -10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .status-message.success {
            display: block;
            background: rgba(46, 213, 115, 0.1);
            color: var(--success);
            border: 1px solid rgba(46, 213, 115, 0.2);
        }

        .status-message.error {
            display: block;
            background: rgba(255, 71, 87, 0.1);
            color: var(--error);
            border: 1px solid rgba(255, 71, 87, 0.2);
        }

        .secured-by {
            text-align: center;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .secured-by img {
            height: 18px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="header">
            <h1>Secure Checkout</h1>
            <p>Complete your food order payment instantly</p>
        </div>

        <div class="form-group">
            <label>ORDER ID</label>
            <input type="number" id="orderId" placeholder="e.g. 1001" value="1001">
        </div>

        <div class="form-group">
            <label>AMOUNT (₹)</label>
            <input type="number" id="amount" placeholder="e.g. 299" value="299">
        </div>

        <div class="form-group">
            <label>EMAIL ADDRESS</label>
            <input type="email" id="email" placeholder="your@email.com" value="test@example.com">
        </div>

        <button class="pay-btn" id="payBtn" onclick="initiatePayment()">
            Pay ₹<span id="btnAmount">299</span>
        </button>

        <div id="statusMessage" class="status-message"></div>

        <div class="secured-by">
            Secured by 
            <svg width="60" height="15" viewBox="0 0 106 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- A placeholder for Razorpay logo feel -->
                <path d="M10.15 15.63H4.81L2.27 23.47H0L3.15 13.8L5.03 8.01H10.1C14.73 8.01 16.59 10.36 15.82 12.72C15.11 14.88 13.3 15.63 10.15 15.63ZM10.51 9.87H7.13L5.43 15.1H9.15C11.45 15.1 12.73 14.39 13.16 13.06C13.62 11.66 12.73 9.87 10.51 9.87Z" fill="#a4b0be"/>
                <path d="M22.95 23.47H20.47L21.36 18.23H15.68L14.79 23.47H12.31L16.27 0.05H18.75L17.58 6.94H23.26L24.43 0.05H26.91L22.95 23.47Z" fill="#a4b0be"/>
            </svg>
        </div>
    </div>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        const amountInput = document.getElementById('amount');
        const btnAmount = document.getElementById('btnAmount');
        const payBtn = document.getElementById('payBtn');
        const statusMessage = document.getElementById('statusMessage');

        // Update button amount dynamically
        amountInput.addEventListener('input', (e) => {
            btnAmount.textContent = e.target.value || '0';
        });

        function showMessage(msg, type) {
            statusMessage.textContent = msg;
            statusMessage.className = 'status-message ' + type;
        }

        async function initiatePayment() {
            const orderId = document.getElementById('orderId').value;
            const amount = document.getElementById('amount').value;
            const userEmail = document.getElementById('email').value;

            if(!orderId || !amount || !userEmail) {
                showMessage('Please fill all fields', 'error');
                return;
            }

            payBtn.classList.add('loading');
            statusMessage.className = 'status-message'; // hide

            try {
                // 1. Call our backend to create Razorpay Order
                const response = await fetch('http://localhost:8084/api/payments/createOrder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: orderId,
                        amount: amount,
                        currency: 'INR',
                        userEmail: userEmail
                    })
                });

                if(!response.ok) throw new Error('Failed to create order on server');
                const paymentData = await response.json();

                // 2. Setup Razorpay Checkout options
                var options = {
                    "key": "rzp_test_TMumSoDKMprn3X", // Test Key provided by you
                    "amount": amount * 100, // in paise
                    "currency": "INR",
                    "name": "Food Delivery App",
                    "description": "Test Transaction for Order #" + orderId,
                    "order_id": paymentData.razorpayOrderId, 
                    "handler": async function (response) {
                        // 3. Payment Success - Verify Signature on backend
                        verifyPayment(response.razorpay_order_id, response.razorpay_payment_id, response.razorpay_signature);
                    },
                    "prefill": {
                        "name": "Test Customer",
                        "email": userEmail,
                        "contact": "9999999999"
                    },
                    "theme": {
                        "color": "#ff4757"
                    }
                };

                var rzp1 = new Razorpay(options);
                
                rzp1.on('payment.failed', function (response){
                    showMessage('Payment Failed! Reason: ' + response.error.description, 'error');
                });

                // Open Razorpay Checkout Window
                rzp1.open();

            } catch (error) {
                showMessage(error.message, 'error');
            } finally {
                payBtn.classList.remove('loading');
            }
        }

        async function verifyPayment(rzpOrderId, rzpPaymentId, rzpSignature) {
            payBtn.classList.add('loading');
            showMessage('Verifying payment...', '');

            try {
                const res = await fetch('http://localhost:8084/api/payments/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        razorpay_order_id: rzpOrderId,
                        razorpay_payment_id: rzpPaymentId,
                        razorpay_signature: rzpSignature
                    })
                });

                const data = await res.json();
                
                if(data.status === 'success') {
                    showMessage('Payment Successful! Order Confirmed.', 'success');
                    payBtn.style.display = 'none'; // Hide button on success
                } else {
                    showMessage('Verification failed! Payment tampered.', 'error');
                }
            } catch (err) {
                showMessage('Error verifying payment', 'error');
            } finally {
                payBtn.classList.remove('loading');
            }
        }
    </script>
</body>
</html>
