<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Restaurant Service</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            box-sizing: border-box;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .dashboard-title {
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.4);
        }

        .btn-secondary {
            background-color: #E5E7EB;
            color: var(--text-main);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #D1D5DB;
            box-shadow: none;
        }
        
        .btn-danger {
            background-color: var(--danger);
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        .btn-danger:hover {
            background-color: #DC2626;
        }

        /* Views */
        #restaurantsView, #menuView {
            display: none;
        }
        #restaurantsView.active, #menuView.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Grid & Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card-image-placeholder {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            font-weight: 800;
            opacity: 0.9;
            position: relative;
        }
        
        .menu-image-placeholder {
            height: 120px;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9CA3AF;
            font-size: 2.5rem;
        }

        .status-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-open { background-color: rgba(16, 185, 129, 0.9); color: white; }
        .status-closed { background-color: rgba(239, 68, 68, 0.9); color: white; }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
        }

        .card-subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0 0 1rem 0;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-details {
            display: flex;
            justify-content: space-between;
            margin-top: auto;
            border-top: 1px solid #E5E7EB;
            padding-top: 1rem;
            font-size: 0.875rem;
            align-items: center;
        }
        
        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal { transform: scale(1); }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 0.5rem;
            box-sizing: border-box; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;
        }

        /* Notification */
        .notification {
            position: fixed; bottom: 2rem; right: 2rem;
            background-color: var(--success); color: white;
            padding: 1rem 2rem; border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s ease; z-index: 100; font-weight: 600;
        }
        .notification.show { transform: translateY(0); opacity: 1; }
        .notification.error { background-color: var(--danger); }
        
        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
        }
        .back-link:hover { text-decoration: underline; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .skeleton-img { height: 160px; background-color: #D1D5DB; }
        .skeleton-text { height: 1.25rem; background-color: #D1D5DB; border-radius: 0.25rem; margin-bottom: 0.5rem; }
        
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1><i class="fas fa-store"></i> Admin Portal</h1>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="index.html" style="color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.875rem; margin-right: 1rem;">Go to Home</a>
            <span style="font-weight: 500; font-size: 0.875rem;">Restaurant Admin</span>
            <div style="width: 32px; height: 32px; background-color: var(--primary); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;">A</div>
        </div>
    </header>

    <div class="container">
        <!-- RESTAURANTS VIEW -->
        <div id="restaurantsView" class="active">
            <div class="dashboard-header">
                <div>
                    <h2 class="dashboard-title">My Restaurants</h2>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;">Select a restaurant to manage its menu.</p>
                </div>
                <button class="btn" onclick="openModal('addRestaurantModal')"><i class="fas fa-plus"></i> Add Restaurant</button>
            </div>
            <div class="grid" id="restaurantGrid"></div>
        </div>

        <!-- MENU VIEW -->
        <div id="menuView">
            <a class="back-link" onclick="showRestaurantsView()"><i class="fas fa-arrow-left"></i> Back to Restaurants</a>
            <div class="dashboard-header" style="margin-top: 1rem;">
                <div>
                    <h2 class="dashboard-title" id="menuRestaurantName">Restaurant Menu</h2>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;">Manage products and dishes for this restaurant.</p>
                </div>
                <button class="btn" onclick="openModal('addMenuModal')"><i class="fas fa-plus"></i> Add Menu Item</button>
            </div>
            <div class="grid" id="menuGrid"></div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="addRestaurantModal">
        <div class="modal">
            <h2>Add New Restaurant</h2>
            <form id="addRestaurantForm" onsubmit="submitRestaurant(event)">
                <div class="form-group">
                    <label>Restaurant Name</label>
                    <input type="text" id="restName" required placeholder="e.g. Spice Route">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="restLocation" required placeholder="e.g. 123 Main St">
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="restContact" required placeholder="e.g. +1 234 567 890">
                </div>
                <div class="form-group">
                    <label>Owner ID</label>
                    <input type="number" id="restOwnerId" required placeholder="1" value="1">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addRestaurantModal')">Cancel</button>
                    <button type="submit" class="btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="addMenuModal">
        <div class="modal">
            <h2>Add Menu Item</h2>
            <form id="addMenuForm" onsubmit="submitMenuItem(event)">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="menuName" required placeholder="e.g. Chicken Tikka">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="menuCategory" required>
                        <option value="Starters">Starters</option>
                        <option value="Main Course">Main Course</option>
                        <option value="Breads">Breads</option>
                        <option value="Desserts">Desserts</option>
                        <option value="Beverages">Beverages</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="menuDesc" rows="3" placeholder="Brief description of the dish..."></textarea>
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" step="0.01" id="menuPrice" required placeholder="299.00">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addMenuModal')">Cancel</button>
                    <button type="submit" class="btn">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <div class="notification" id="notification">Action successful!</div>

    <script>
        const API_REST = '/api/restaurants';
        let currentRestaurantId = null;

        // Utilities
        function showNotification(msg, isError = false) {
            const notif = document.getElementById('notification');
            notif.innerText = msg;
            notif.className = 'notification show' + (isError ? ' error' : '');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        function getGradient(name) {
            const hue = (name.charCodeAt(0) * 15) % 360;
            return `linear-gradient(135deg, hsl(${hue}, 70%, 70%) 0%, hsl(${hue}, 70%, 40%) 100%)`;
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { 
            document.getElementById(id).classList.remove('active');
            if(id === 'addRestaurantModal') document.getElementById('addRestaurantForm').reset();
            if(id === 'addMenuModal') document.getElementById('addMenuForm').reset();
        }

        // --- RESTAURANTS LOGIC ---

        function showRestaurantsView() {
            document.getElementById('menuView').classList.remove('active');
            document.getElementById('restaurantsView').classList.add('active');
            currentRestaurantId = null;
        }

        async function fetchRestaurants() {
            const grid = document.getElementById('restaurantGrid');
            grid.innerHTML = '<div class="skeleton-text" style="width:100%">Loading...</div>';
            try {
                const res = await fetch(API_REST);
                if (!res.ok) throw new Error();
                const data = await res.json();
                grid.innerHTML = data.length ? '' : '<p>No restaurants found. Add one!</p>';
                
                data.forEach((r, i) => {
                    const statusClass = r.isActive ? 'status-open' : 'status-closed';
                    const statusText = r.isActive ? 'OPEN' : 'CLOSED';
                    
                    grid.innerHTML += `
                        <div class="card" onclick="openMenu(${r.id}, '${r.name.replace(/'/g, "\\'")}')" style="opacity:0; transform:translateY(20px); animation:fadeInUp 0.5s forwards ${i*0.1}s;">
                            <div class="card-image-placeholder" style="background: ${getGradient(r.name)}">
                                ${r.name.charAt(0).toUpperCase()}
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">${r.name}</h3>
                                <p class="card-subtitle"><i class="fas fa-map-marker-alt"></i> ${r.location}</p>
                                <div class="card-details">
                                    <span><i class="fas fa-phone"></i> ${r.contactNumber || 'N/A'}</span>
                                    <span>Manage Menu &rarr;</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                grid.innerHTML = `<p style="color:var(--danger)">Error connecting to backend.</p>`;
            }
        }

        async function submitRestaurant(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('restName').value,
                location: document.getElementById('restLocation').value,
                contactNumber: document.getElementById('restContact').value,
                ownerId: parseInt(document.getElementById('restOwnerId').value),
                isActive: true
            };
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerText = 'Saving...';
            try {
                const res = await fetch(API_REST, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error();
                showNotification('Restaurant added!');
                closeModal('addRestaurantModal');
                fetchRestaurants();
            } catch (err) {
                showNotification('Error adding restaurant', true);
            } finally {
                btn.disabled = false; btn.innerText = 'Save';
            }
        }

        // --- MENU LOGIC ---

        function openMenu(id, name) {
            currentRestaurantId = id;
            document.getElementById('menuRestaurantName').innerText = `${name} - Menu`;
            document.getElementById('restaurantsView').classList.remove('active');
            document.getElementById('menuView').classList.add('active');
            fetchMenu();
        }

        function getCategoryIcon(cat) {
            if(cat.includes('Starter')) return 'fa-seedling';
            if(cat.includes('Dessert')) return 'fa-ice-cream';
            if(cat.includes('Beverage')) return 'fa-glass-martini-alt';
            if(cat.includes('Bread')) return 'fa-bread-slice';
            return 'fa-utensils';
        }

        async function fetchMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '<p>Loading menu...</p>';
            try {
                // Fetching all items (onlyAvailable=false can be sent if needed, default is true in controller)
                const res = await fetch(`/api/restaurants/${currentRestaurantId}/menu?onlyAvailable=false`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                grid.innerHTML = data.length ? '' : '<p>No menu items found. Add some dishes!</p>';
                
                data.forEach((item, i) => {
                    grid.innerHTML += `
                        <div class="card" style="opacity:0; transform:translateY(20px); animation:fadeInUp 0.5s forwards ${i*0.1}s;">
                            <div class="menu-image-placeholder">
                                <i class="fas ${getCategoryIcon(item.category)}"></i>
                            </div>
                            <div class="card-content">
                                <div style="display:flex; justify-content:space-between; align-items:start;">
                                    <h3 class="card-title">${item.name}</h3>
                                    <span class="price-tag">₹${item.price.toFixed(2)}</span>
                                </div>
                                <p class="card-subtitle">${item.category}</p>
                                <p style="font-size:0.875rem; color:var(--text-main); margin-bottom:1rem; flex-grow:1;">
                                    ${item.description || 'No description provided.'}
                                </p>
                                <div class="card-details">
                                    <span style="color: ${item.available ? 'var(--success)' : 'var(--danger)'}; font-weight:600;">
                                        ${item.available ? 'Available' : 'Out of Stock'}
                                    </span>
                                    <button class="btn btn-danger" onclick="deleteMenuItem(${item.id}, event)">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                grid.innerHTML = `<p style="color:var(--danger)">Error loading menu.</p>`;
            }
        }

        async function submitMenuItem(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('menuName').value,
                category: document.getElementById('menuCategory').value,
                description: document.getElementById('menuDesc').value,
                price: parseFloat(document.getElementById('menuPrice').value),
                isAvailable: true
            };
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerText = 'Saving...';
            try {
                const res = await fetch(`/api/restaurants/${currentRestaurantId}/menu`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error();
                showNotification('Menu item added!');
                closeModal('addMenuModal');
                fetchMenu();
            } catch (err) {
                showNotification('Error adding menu item', true);
            } finally {
                btn.disabled = false; btn.innerText = 'Save Item';
            }
        }

        async function deleteMenuItem(itemId, event) {
            event.stopPropagation();
            if(!confirm('Are you sure you want to delete this item?')) return;
            
            try {
                const res = await fetch(`/api/menu/${itemId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                showNotification('Item deleted!');
                fetchMenu();
            } catch (err) {
                showNotification('Error deleting item', true);
            }
        }

        // Init
        window.addEventListener('DOMContentLoaded', fetchRestaurants);
    </script>
</body>
</html>
