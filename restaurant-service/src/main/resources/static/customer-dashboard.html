<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Order Food Online</title>
    <style>
        :root {
            --primary: #F97316; /* Orange for food app */
            --primary-hover: #EA580C;
            --bg-color: #FAFAF9;
            --card-bg: #FFFFFF;
            --text-main: #1C1917;
            --text-muted: #78716C;
            --success: #10B981;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            width: 100%; background-color: var(--card-bg); padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; position: sticky; top: 0; z-index: 10;
        }

        h1 {
            font-size: 1.75rem; margin: 0; font-weight: 800;
            color: var(--primary); letter-spacing: -0.025em; display: flex; align-items: center; gap: 0.5rem;
        }

        .container {
            width: 100%; max-width: 1200px; padding: 2rem; box-sizing: border-box;
        }

        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;
        }

        .dashboard-title { font-size: 2rem; font-weight: 800; margin: 0; }

        /* Grid & Cards */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg); border-radius: 1rem; overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex; flex-direction: column; cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .card-image-placeholder {
            height: 180px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 3rem; font-weight: 800; opacity: 0.9;
        }
        
        .menu-image-placeholder {
            height: 140px; background: #F3F4F6; display: flex; align-items: center; justify-content: center;
            color: #9CA3AF; font-size: 3rem;
        }

        .card-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1.25rem; font-weight: 700; margin: 0 0 0.5rem 0; }
        .card-subtitle { color: var(--text-muted); font-size: 0.875rem; margin: 0 0 1rem 0; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }

        .card-details {
            display: flex; justify-content: space-between; margin-top: auto;
            border-top: 1px solid #E5E7EB; padding-top: 1rem; font-size: 0.875rem; align-items: center;
        }
        
        .price-tag { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }

        .btn {
            background-color: var(--primary); color: white; border: none;
            padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
        }
        .btn:hover { background-color: var(--primary-hover); transform: scale(1.05); }

        /* Views */
        #restaurantsView, #menuView { display: none; }
        #restaurantsView.active, #menuView.active { display: block; animation: fadeIn 0.3s ease; }

        .back-link {
            color: var(--primary); text-decoration: none; font-weight: 600;
            display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; cursor: pointer;
        }
        .back-link:hover { text-decoration: underline; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        /* Category Sections */
        .category-title {
            width: 100%; font-size: 1.5rem; font-weight: 700;
            margin: 2rem 0 1rem 0; padding-bottom: 0.5rem; border-bottom: 2px solid #E5E7EB;
            grid-column: 1 / -1;
        }

        /* Cart Floating Action Button */
        .cart-fab {
            position: fixed; bottom: 2rem; right: 2rem;
            background-color: var(--text-main); color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.2s; z-index: 50;
        }
        .cart-fab:hover { transform: scale(1.1); }
        .cart-badge {
            position: absolute; top: -5px; right: -5px;
            background-color: var(--primary); color: white;
            font-size: 0.75rem; font-weight: bold;
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1><i class="fas fa-hamburger"></i> Foodie</h1>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="index.html" style="color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.875rem; margin-right: 1rem;">Go to Home</a>
            <span style="font-weight: 500; font-size: 0.875rem;">Guest User</span>
            <div style="width: 32px; height: 32px; background-color: #E5E7EB; border-radius: 50%; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-weight: bold;"><i class="fas fa-user"></i></div>
        </div>
    </header>

    <div class="container">
        <!-- RESTAURANTS VIEW -->
        <div id="restaurantsView" class="active">
            <div class="dashboard-header">
                <div>
                    <h2 class="dashboard-title">Order from top restaurants</h2>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;">Fresh food delivered to your door.</p>
                </div>
            </div>
            <div class="grid" id="restaurantGrid"></div>
        </div>

        <!-- MENU VIEW -->
        <div id="menuView">
            <a class="back-link" onclick="showRestaurantsView()"><i class="fas fa-arrow-left"></i> Back to all restaurants</a>
            <div class="dashboard-header" style="margin-top: 1rem;">
                <div>
                    <h2 class="dashboard-title" id="menuRestaurantName">Restaurant Menu</h2>
                    <p style="color: var(--text-muted); margin-top: 0.5rem;" id="menuRestaurantLoc"><i class="fas fa-map-marker-alt"></i> Location</p>
                </div>
            </div>
            <div class="grid" id="menuGrid"></div>
        </div>
    </div>

    <div class="cart-fab" onclick="alert('Order Service is under development! Cart feature coming soon.')">
        <i class="fas fa-shopping-cart"></i>
        <div class="cart-badge" id="cartCount">0</div>
    </div>

    <script>
        const API_REST = '/api/restaurants';
        let currentRestaurantId = null;
        let cartItems = 0;

        function getGradient(name) {
            const hue = (name.charCodeAt(0) * 15) % 360;
            return `linear-gradient(135deg, hsl(${hue}, 70%, 70%) 0%, hsl(${hue}, 70%, 40%) 100%)`;
        }

        // --- RESTAURANTS LOGIC ---

        function showRestaurantsView() {
            document.getElementById('menuView').classList.remove('active');
            document.getElementById('restaurantsView').classList.add('active');
        }

        async function fetchRestaurants() {
            const grid = document.getElementById('restaurantGrid');
            grid.innerHTML = '<p>Loading amazing food spots...</p>';
            try {
                const res = await fetch(API_REST);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                // Only show active restaurants to customers
                const activeRestaurants = data.filter(r => r.isActive);
                
                grid.innerHTML = activeRestaurants.length ? '' : '<p>No restaurants available right now.</p>';
                
                activeRestaurants.forEach((r, i) => {
                    grid.innerHTML += `
                        <div class="card" onclick="openMenu(${r.id}, '${r.name.replace(/'/g, "\\'")}', '${r.location.replace(/'/g, "\\'")}')" style="opacity:0; transform:translateY(20px); animation:fadeInUp 0.5s forwards ${i*0.1}s;">
                            <div class="card-image-placeholder" style="background: ${getGradient(r.name)}">
                                ${r.name.charAt(0).toUpperCase()}
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">${r.name}</h3>
                                <p class="card-subtitle"><i class="fas fa-map-marker-alt"></i> ${r.location}</p>
                                <div class="card-details">
                                    <span><i class="fas fa-star" style="color:#F59E0B"></i> 4.5</span>
                                    <span style="color:var(--primary); font-weight:600;">View Menu &rarr;</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                grid.innerHTML = `<p style="color:var(--danger)">Could not connect to servers. Please try again later.</p>`;
            }
        }

        // --- MENU LOGIC ---

        function openMenu(id, name, location) {
            currentRestaurantId = id;
            document.getElementById('menuRestaurantName').innerText = name;
            document.getElementById('menuRestaurantLoc').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${location}`;
            
            document.getElementById('restaurantsView').classList.remove('active');
            document.getElementById('menuView').classList.add('active');
            fetchMenu();
        }

        function getCategoryImg(cat) {
            // Using unsplash random food images as placeholder
            let keyword = 'food';
            if(cat.includes('Starter')) keyword = 'appetizer';
            if(cat.includes('Dessert')) keyword = 'dessert';
            if(cat.includes('Beverage')) keyword = 'drink';
            return `https://source.unsplash.com/random/400x300/?${keyword}`;
        }

        async function fetchMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '<p>Loading menu...</p>';
            try {
                // Customers only see available items
                const res = await fetch(`/api/restaurants/${currentRestaurantId}/menu?onlyAvailable=true`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                grid.innerHTML = data.length ? '' : '<p>No menu items available at this moment.</p>';
                
                // Group by category
                const grouped = data.reduce((acc, item) => {
                    (acc[item.category] = acc[item.category] || []).push(item);
                    return acc;
                }, {});

                let delay = 0;
                for (const [category, items] of Object.entries(grouped)) {
                    grid.innerHTML += `<div class="category-title">${category}</div>`;
                    
                    items.forEach((item) => {
                        grid.innerHTML += `
                            <div class="card" style="opacity:0; transform:translateY(20px); animation:fadeInUp 0.5s forwards ${delay*0.05}s;">
                                <div class="card-content" style="padding:1rem;">
                                    <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom: 0.5rem;">
                                        <h3 class="card-title" style="margin:0; font-size:1.1rem;">${item.name}</h3>
                                        <span class="price-tag">₹${item.price.toFixed(2)}</span>
                                    </div>
                                    <p style="font-size:0.875rem; color:var(--text-muted); margin-bottom:1rem; flex-grow:1;">
                                        ${item.description || ''}
                                    </p>
                                    <div style="display:flex; justify-content:flex-end;">
                                        <button class="btn" onclick="addToCart(event)">Add +</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        delay++;
                    });
                }

            } catch (err) {
                grid.innerHTML = `<p style="color:var(--danger)">Error loading menu.</p>`;
            }
        }

        function addToCart(event) {
            event.stopPropagation();
            cartItems++;
            document.getElementById('cartCount').innerText = cartItems;
            
            // Animation effect
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = 'Added ✓';
            btn.style.backgroundColor = 'var(--success)';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = 'var(--primary)';
            }, 1000);
        }

        // Init
        window.addEventListener('DOMContentLoaded', fetchRestaurants);
    </script>
</body>
</html>
