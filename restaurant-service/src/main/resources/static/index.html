<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery System</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #F3F4F6;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh;
            color: #1F2937;
        }
        .container {
            background-color: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { margin-top: 0; font-weight: 800; font-size: 2rem; color: #111827; }
        p { color: #6B7280; margin-bottom: 2rem; }
        
        .portal-link {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: transform 0.2s;
        }
        
        .portal-link:hover { transform: translateY(-3px); }
        
        .admin-link {
            background-color: #4F46E5;
            color: white;
            border: 2px solid #4F46E5;
        }
        
        .customer-link {
            background-color: #F97316;
            color: white;
            border: 2px solid #F97316;
        }
        
        i { margin-right: 0.5rem; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to Foodie</h1>
        <p>Choose your portal to continue.</p>
        
        <a href="customer-dashboard.html" class="portal-link customer-link">
            <i class="fas fa-hamburger"></i> Order Food (Customer)
        </a>
        
        <a href="admin-dashboard.html" class="portal-link admin-link">
            <i class="fas fa-store"></i> Manage Restaurants (Admin)
        </a>
    </div>
</body>
</html>
