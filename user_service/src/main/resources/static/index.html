<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery Service - Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-dark: #ff3344;
            --bg-color: #0f111a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a5b1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 71, 87, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(55, 43, 255, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #a0a5b1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 0.3rem;
            margin-bottom: 2rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }

        .form-section {
            display: none;
            animation: slideIn 0.4s ease forwards;
        }

        .form-section.active {
            display: block;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.15);
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .text-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: opacity 0.2s ease;
            cursor: pointer;
        }

        .text-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }
        
        .text-center {
            text-align: center;
        }

        /* Notifications */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: rgba(32, 191, 107, 0.9); backdrop-filter: blur(8px); }
        .toast.error { background: rgba(235, 59, 90, 0.9); backdrop-filter: blur(8px); }
        .toast.info { background: rgba(69, 170, 242, 0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body>

    <div id="toast" class="toast">Message goes here</div>

    <div class="container">
        <div class="header">
            <h1>Welcome Back</h1>
            <p>Your favorite food, just a tap away.</p>
        </div>

        <div class="tabs" id="mainTabs">
            <div class="tab active" onclick="switchSection('signin')">Sign In</div>
            <div class="tab" onclick="switchSection('signup')">Sign Up</div>
        </div>

        <!-- SIGN IN SECTION -->
        <div id="signin" class="form-section active">
            <form id="signinForm" onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label>Email or Phone Number</label>
                    <input type="text" id="si_identifier" class="form-control" placeholder="Enter email or phone" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="si_password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
                <div class="text-center">
                    <a class="text-link" onclick="switchSection('forgot')">Forgot your password?</a>
                </div>
            </form>
        </div>

        <!-- SIGN UP SECTION -->
        <div id="signup" class="form-section">
            <form id="signupForm" onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="su_name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="su_email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="su_phone" class="form-control" placeholder="+919876543210" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="su_password" class="form-control" placeholder="Create a strong password" required>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="su_role" class="form-control" required>
                        <option value="ROLE_CUSTOMER">Customer</option>
                        <option value="ROLE_RESTAURANT_OWNER">Restaurant Owner</option>
                        <option value="ROLE_DELIVERY_BOY">Delivery Boy</option>
                    </select>
                </div>
                <button type="submit" class="btn">Create Account</button>
            </form>
        </div>

        <!-- FORGOT PASSWORD SECTION -->
        <div id="forgot" class="form-section">
            <form id="forgotForm" onsubmit="handleForgot(event)">
                <div class="form-group">
                    <label>Registered Email or Phone</label>
                    <input type="text" id="fp_identifier" class="form-control" placeholder="Enter email or phone" required>
                </div>
                <button type="submit" class="btn">Send OTP</button>
                <div class="text-center">
                    <a class="text-link" onclick="switchSection('signin')">Back to Sign In</a>
                </div>
            </form>
        </div>

        <!-- RESET PASSWORD SECTION -->
        <div id="reset" class="form-section">
            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label>Identifier (Email/Phone)</label>
                    <input type="text" id="rp_identifier" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label>Enter 6-digit OTP</label>
                    <input type="text" id="rp_otp" class="form-control" placeholder="123456" required maxlength="6">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="rp_password" class="form-control" placeholder="New secure password" required>
                </div>
                <button type="submit" class="btn">Reset Password</button>
                <div class="text-center" style="margin-top: 1rem;">
                    <a id="resendOtpBtn" class="text-link" onclick="handleResendOtp()" style="pointer-events: none; opacity: 0.5;">Resend OTP in 30s</a>
                </div>
            </form>
        </div>

    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api/auth';

        function switchSection(sectionId) {
            // Hide all sections
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            // Show target
            document.getElementById(sectionId).classList.add('active');

            // Manage tabs highlighting
            const tabs = document.getElementById('mainTabs');
            if (sectionId === 'signin' || sectionId === 'signup') {
                tabs.style.display = 'flex';
                document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
                if(sectionId === 'signin') tabs.children[0].classList.add('active');
                if(sectionId === 'signup') tabs.children[1].classList.add('active');
                
                document.querySelector('.header h1').innerText = sectionId === 'signin' ? 'Welcome Back' : 'Join Us';
                document.querySelector('.header p').innerText = sectionId === 'signin' ? 'Your favorite food, just a tap away.' : 'Start your culinary journey today.';
            } else {
                tabs.style.display = 'none';
                document.querySelector('.header h1').innerText = sectionId === 'forgot' ? 'Recover Account' : 'Set New Password';
                document.querySelector('.header p').innerText = sectionId === 'forgot' ? 'We will send you an OTP to reset.' : 'Enter OTP to secure your account.';
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.className = 'toast ' + type;
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const identifier = document.getElementById('si_identifier').value;
            const password = document.getElementById('si_password').value;

            try {
                const res = await fetch(API_BASE + '/signin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({identifier, password})
                });
                const data = await res.json();
                
                if (res.ok) {
                    showToast('Login successful! Redirecting...', 'success');
                    // In real app: localStorage.setItem('token', data.token);
                    // window.location.href = '/dashboard';
                } else {
                    showToast(data.message || 'Login failed', 'error');
                }
            } catch (err) {
                showToast('Server error', 'error');
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('su_name').value,
                email: document.getElementById('su_email').value,
                phoneNumber: document.getElementById('su_phone').value,
                password: document.getElementById('su_password').value,
                role: document.getElementById('su_role').value,
                address: ''
            };

            try {
                const res = await fetch(API_BASE + '/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (res.ok) {
                    showToast('Account created successfully!', 'success');
                    setTimeout(() => switchSection('signin'), 1500);
                } else {
                    showToast(data.message || 'Signup failed', 'error');
                }
            } catch (err) {
                showToast('Server error', 'error');
            }
        }

        let resendTimer = null;
        let resendSeconds = 30;

        function startResendTimer() {
            resendSeconds = 30;
            const resendBtn = document.getElementById('resendOtpBtn');
            resendBtn.style.pointerEvents = 'none';
            resendBtn.style.opacity = '0.5';
            
            clearInterval(resendTimer);
            resendTimer = setInterval(() => {
                resendSeconds--;
                resendBtn.innerText = `Resend OTP in ${resendSeconds}s`;
                if (resendSeconds <= 0) {
                    clearInterval(resendTimer);
                    resendBtn.innerText = 'Resend OTP';
                    resendBtn.style.pointerEvents = 'auto';
                    resendBtn.style.opacity = '1';
                }
            }, 1000);
        }

        async function handleForgot(e) {
            e.preventDefault();
            const identifier = document.getElementById('fp_identifier').value;

            showToast('Sending OTP...', 'info');
            try {
                const res = await fetch(API_BASE + '/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({identifier})
                });
                
                if (res.ok) {
                    showToast('OTP sent successfully!', 'success');
                    document.getElementById('rp_identifier').value = identifier;
                    setTimeout(() => {
                        switchSection('reset');
                        startResendTimer();
                    }, 1000);
                } else {
                    const data = await res.json();
                    showToast(data.message || 'Failed to send OTP', 'error');
                }
            } catch (err) {
                showToast('Server error', 'error');
            }
        }

        async function handleResendOtp() {
            const identifier = document.getElementById('rp_identifier').value;
            showToast('Resending OTP...', 'info');
            try {
                const res = await fetch(API_BASE + '/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({identifier})
                });
                
                if (res.ok) {
                    showToast('OTP resent successfully!', 'success');
                    startResendTimer();
                } else {
                    const data = await res.json();
                    showToast(data.message || 'Failed to resend OTP', 'error');
                }
            } catch (err) {
                showToast('Server error', 'error');
            }
        }

        async function handleReset(e) {
            e.preventDefault();
            const payload = {
                identifier: document.getElementById('rp_identifier').value,
                otp: document.getElementById('rp_otp').value,
                newPassword: document.getElementById('rp_password').value
            };

            try {
                const res = await fetch(API_BASE + '/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    showToast('Password reset successfully!', 'success');
                    setTimeout(() => switchSection('signin'), 1500);
                } else {
                    const data = await res.json();
                    showToast(data.message || 'Reset failed', 'error');
                }
            } catch (err) {
                showToast('Server error', 'error');
            }
        }
    </script>
</body>
</html>
